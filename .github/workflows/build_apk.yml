name: Build D-MESH Android APK

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch: # Allows manual trigger with one click in GitHub Actions

jobs:
  build:
    name: Build Release APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Java JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter SDK
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Recreate Android Scaffolding with Official Flutter Toolchain
        run: |
          rm -rf android
          flutter create . --platforms=android
          node -e "const fs = require('fs'); const p = 'android/app/src/main/AndroidManifest.xml'; let xml = fs.readFileSync(p, 'utf8'); const perms = ['android.permission.INTERNET','android.permission.ACCESS_NETWORK_STATE','android.permission.ACCESS_WIFI_STATE','android.permission.CHANGE_WIFI_STATE','android.permission.CHANGE_NETWORK_STATE','android.permission.ACCESS_FINE_LOCATION','android.permission.ACCESS_COARSE_LOCATION','android.permission.RECORD_AUDIO','android.permission.READ_EXTERNAL_STORAGE','android.permission.WRITE_EXTERNAL_STORAGE'].map(x => '    <uses-permission android:name=\"' + x + '\"/>').join('\n'); xml = xml.replace('<application', perms + '\n    <application'); xml = xml.replace('<application', '<application\n        android:usesCleartextTraffic=\"true\"'); fs.writeFileSync(p, xml);"
          rm -f test/widget_test.dart

      - name: Install Dependencies
        run: flutter pub get

      - name: Run Automated Test Suite
        run: flutter test

      - name: Build Release APK
        run: flutter build apk --release --android-skip-build-dependency-validation


      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: dmesh-emergency-release-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error

