name: d_mesh
description: "D-MESH - Decentralized Emergency Communication & Rescue Mesh System"
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.0.0 <4.0.0"
  flutter: ">=3.10.0"

dependencies:
  flutter:
    sdk: flutter

  # State Management
  flutter_riverpod: ^2.5.1
  
  # Persistence & Database
  sqflite: ^2.3.3+1
  sqflite_common_ffi: ^2.3.3
  path_provider: ^2.1.3
  path: ^1.9.0
  shared_preferences: ^2.2.3

  # Mapping & Geospatial
  flutter_map: ^6.1.0
  latlong2: ^0.9.1

  # Networking & Real-Time Hardware Communication
  http: ^1.2.1
  web_socket_channel: ^3.0.3
  network_info_plus: ^5.0.3

  # Speech & Audio
  speech_to_text: ^7.5.0
  audioplayers: ^6.0.0

  # Cryptography & Security
  encrypt: ^5.0.3
  crypto: ^3.0.3

  # UI & Utilities
  uuid: ^4.4.0
  intl: ^0.19.0
  font_awesome_flutter: ^10.7.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/audio/
    - assets/map_tiles/
