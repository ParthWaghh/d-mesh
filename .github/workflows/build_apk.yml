name: Build D-MESH Android APK

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch: # Allows manual trigger with one click in GitHub Actions

jobs:
  build:
    name: Build Release APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Java JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter SDK
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Recreate Android Scaffolding with Official Flutter Toolchain
        run: |
          cp android/app/src/main/AndroidManifest.xml /tmp/AndroidManifest.xml.bak
          flutter create . --platforms=android --org com.dmesh.emergency.network
          cp /tmp/AndroidManifest.xml.bak android/app/src/main/AndroidManifest.xml

      - name: Install Dependencies
        run: flutter pub get

      - name: Run Automated Test Suite
        run: flutter test

      - name: Build Release APK
        run: flutter build apk --release --android-skip-build-dependency-validation


      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: dmesh-emergency-release-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error

